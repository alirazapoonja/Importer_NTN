<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan Importer NTN Search</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --text:#1c2330; --muted:#6b7585; --accent:#0b6e4f; --line:#e3e7ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161d; --card:#1b212b; --text:#e8ecf2; --muted:#98a2b3; --accent:#3ecf8e; --line:#2b3340; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--text); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  input { width:100%; padding: 14px 16px; font-size: 1.05rem; border-radius: 10px;
          border:1px solid var(--line); background:var(--card); color:var(--text); }
  input:focus { outline: 2px solid var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          margin-top: 20px; overflow-x:auto; }
  table { width:100%; border-collapse: collapse; }
  th, td { text-align:left; padding: 12px 16px; border-bottom:1px solid var(--line); }
  th { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  tr:last-child td { border-bottom:none; }
  td.ntn { font-family: ui-monospace, Menlo, Consolas, monospace; color:var(--accent); font-weight:600; white-space:nowrap; }
  .msg { color:var(--muted); margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Importer NTN Search</h1>
  <p class="sub">Type an importer's name to find their National Tax Number (NTN).</p>

  <input id="q" type="search" placeholder="e.g. Ali Traders" autocomplete="off" autofocus>
  <div id="msg" class="msg"></div>

  <div id="card" class="card" hidden>
    <table>
      <thead><tr><th>Importer Name</th><th>NTN</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const q = document.getElementById('q');
const rows = document.getElementById('rows');
const card = document.getElementById('card');
const msg = document.getElementById('msg');
let timer;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function search() {
  const term = q.value.trim();
  if (term.length < 3) {
    card.hidden = true;
    msg.textContent = term ? 'Type at least 3 letters.' : '';
    return;
  }
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(term));
    const data = await res.json();
    rows.innerHTML = data.results.map(r =>
      `<tr><td>${esc(r.name)}</td><td class="ntn">${esc(r.ntn)}</td></tr>`).join('');
    card.hidden = data.results.length === 0;
    msg.textContent = data.results.length === 0
      ? 'No importer found.'
      : (data.limited ? 'Showing the first 50 matches. Type more of the name to narrow down.' : data.results.length + ' result(s) found.');
  } catch (e) {
    msg.textContent = 'Something went wrong. Please try again.';
  }
}

q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 250); });
</script>
</body>
</html>
